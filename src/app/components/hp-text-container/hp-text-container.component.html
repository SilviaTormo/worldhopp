<div [ngClass]="{ 'theme-dark': theme === 'dark', 'theme-light': theme === 'light' }">
  @if (subtitle !== null) {
    <h3>{{ subtitle }}</h3>
  }
  @if (title !== null) {
    <h2>{{ title }}</h2>
  }
  @if (title2 !== null) {
    <h2>{{ title2 }}</h2>
  }
  @if (paragraph !== null) {
    <p>{{ paragraph }}</p>
  }
</div>
