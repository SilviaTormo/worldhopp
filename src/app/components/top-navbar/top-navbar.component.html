  <div class="tnb-main-nav">
    <nav>
      <ul>
        @if (anchors.length > 0) {
          @for (anchor of anchors; track anchor.id; let num = $index) {
            @if (printLogo(num, anchors.length)) {
              <li id="worldhopp-logo" class="logo" (click)="logoEvents()">
                <img class="logo-image" src="img/saltamontes.svg" alt="Worldhopp" />
              </li>
            }
            <li [attr.id]="anchor.id ? 'link-' + anchor.id : ''" [ngClass]="{ active: activeId === anchor.id }">
              <a (click)="goTo(anchor.section)" [attr.href]="'#' + anchor.id">{{ anchor.name }}</a>
            </li>
          }
        } @else {
          <li id="worldhopp-logo" class="logo" (click)="logoEvents()">
            <img class="logo-image" src="img/saltamontes.svg" alt="Worldhopp" />
          </li>
        }
      </ul>
    </nav>
  </div>
