<div class="slider-container">
  <div #eSliderList [ngClass]="['slider-list', sliderClassName]" (window:resize)="getSliderWidth()">
    <ng-container *ngFor="let slider of sliderList; let index = index">
      <div class="slider-item" [ngClass]="{'current-slider': currentSlider === index}" [attr.data-slider-index]="index"
        [style.background-image]="setBgImage(slider?.photo)">
        <ng-container *ngIf="slider?.user != '' || slider?.comment != ''">
          <div class="si-comment">
            <div>
              <h5 *ngIf="slider?.user != ''">{{ slider?.user }}</h5>
              <p *ngIf="slider?.comment != ''">{{ slider?.comment }}</p>
            </div>
          </div>
        </ng-container>
      </div>
    </ng-container>
  </div>
  <ng-container *ngIf="sliderList.length > 1">
    <div class="slider-dots">
      <ul>
        <li *ngFor="let slider of sliderList; let index = index" [ngClass]="{'current-slider': currentSlider === index}"
          (click)="goTo(index)"></li>
      </ul>
    </div>
  </ng-container>
</div>
