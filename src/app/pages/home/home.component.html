<header>
  <app-top-navbar [anchors]="menu"></app-top-navbar>
</header>
<main>
  <div id="home-page">
    <div class="hero">
      <div class="box">
        <h1>worldhopp</h1>
        <div id="claim">¡Sube de Nivel!</div>
      </div>
      <!-- Poster first; video lazy + muted so it never blocks LCP or autoplay-blocks -->
      <!-- CSS background provides the visual; poster omitted so the image is fetched once -->
      <video autoplay loop muted playsinline preload="none">
        <source src="video/hero.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="container">
      <app-hp-sc-our-destinations></app-hp-sc-our-destinations>
      <app-hp-sc-reasons></app-hp-sc-reasons>
    </div>

    <div class="container">
      <app-hp-sc-services></app-hp-sc-services>
      <app-hp-sc-steps-to-follow></app-hp-sc-steps-to-follow>
      <app-hp-sc-experiences></app-hp-sc-experiences>
      <app-hp-sc-team></app-hp-sc-team>
      <app-hp-sc-learn-english></app-hp-sc-learn-english>
    </div>

    <div class="container">
      <app-hp-sc-contact></app-hp-sc-contact>
    </div>

    <div class="container">
      <app-hp-sc-partners></app-hp-sc-partners>
      <app-hp-sc-social></app-hp-sc-social>
    </div>
  </div>
</main>
<footer>
  <app-footer></app-footer>
</footer>
